<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Campus Events | Add Event</title>
</head>
<body align="center">
  <header>
    <h1>Add Event</h1>
    <nav>
      <a href="index.html">Home</a> |
      <a href="etkinlikler.html">List</a> |
      <a href="etkinlik-ekle.html">Add</a> |
      <a href="etkinlik-guncelle.html">Update</a> |
      <a href="etkinlik-sil.html">Delete</a>
    </nav>
  </header>

  <br>

  <main>
    <form action="#" method="get">

      <div>
        <label for="eventName">Event Name</label><br>
        <input type="text" id="eventName" name="eventName" required>
      </div>

      <br>

      <div>
        <label for="category">Category</label><br>
        <select id="category" name="category" required>
          <option value="">Select...</option>
          <option value="seminar">Seminar</option>
          <option value="workshop">Workshop</option>
          <option value="talk">Talk</option>
        </select>
      </div>

      <br>

      <div>
        <label for="date">Date</label><br>
        <input type="date" id="date" name="date" required>
      </div>

      <br>

      <div>
        <label for="time">Time</label><br>
        <input type="time" id="time" name="time" required>
      </div>

      <br>

      <div>
        <label for="location">Location</label><br>
        <input type="text" id="location" name="location" required>
      </div>

      <br>

      <div>
        <label for="quota">Quota</label><br>
        <input type="number" id="quota" name="quota" min="1" required>
      </div>

      <br>

      <div>
        <label for="description">Description</label><br>
        <textarea id="description" name="description" rows="4" cols="30" required></textarea>
      </div>

      <br>

      <button type="submit">Save</button>

    </form>
  </main>

  <br><br>

  <footer>
    <p>Fadime Kovalık · 2026</p>
  </footer>
</body>
</html>
