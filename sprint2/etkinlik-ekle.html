<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/2321032006.css">
  <title>Campus Events | Add Event</title>
</head>
<body>
  <header>
    <h1>Add Event</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="etkinlikler.html">Events</a>
      <a href="etkinlik-ekle.html">Add</a>
      <a href="etkinlik-guncelle.html">Update</a>
      <a href="etkinlik-sil.html">Delete</a>
    </nav>
  </header>

  <main>
    <form action="#" method="get">
      <div>
        <label for="eventName">Event Name</label>
        <input type="text" id="eventName" name="eventName" required>
      </div>
      <div>
        <label for="category">Category</label>
        <select id="category" name="category" required><option value="">Select...</option><option value="seminar">Seminar</option><option value="workshop">Workshop</option><option value="talk">Talk</option></select>
      </div>
      <div>
        <label for="date">Date</label>
        <input type="date" id="date" name="date" required>
      </div>
      <div>
        <label for="time">Time</label>
        <input type="time" id="time" name="time" required>
      </div>
      <div>
        <label for="location">Location</label>
        <input type="text" id="location" name="location" required>
      </div>
      <div>
        <label for="quota">Quota</label>
        <input type="number" id="quota" name="quota" min="1" required>
      </div>
      <div>
        <label for="description">Description</label>
        <textarea id="description" name="description" rows="4" required></textarea>
      </div>
      <button type="submit">Save</button>
    </form>
  </main>

  <footer>
    <p>Fadime Kovalık · 2026</p>
  </footer>
</body>
</html>
