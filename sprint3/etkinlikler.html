<!DOCTYPE html>

  <script type="module" src="js/event-list.js"></script>
  <title>Campus Events | Event List</title>

<body>
  <header>
    <h1>Event List</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="etkinlikler.html">Events</a>
      <a href="etkinlik-ekle.html">Add</a>
    </nav>
  </header>

  <main>
    <section>
      <h2>All Campus Events</h2>
      <form id="filter-form" class="filter">
        <div>
          <label for="search">Search events</label>
          <input type="search" id="search" name="search" placeholder="e.g. workshop, career">
        </div>
        <div>
          <label for="category-filter">Category</label>
          <select id="category-filter" name="category">
            <option value="">All</option>
          </select>
        </div>
      </form>
      <p id="result" role="status"></p>
      <div class="cards" id="event-list"></div>
    </section>
  </main>

  <footer>
    <p>Fadime Kovalık · 2026</p>
  </footer>
